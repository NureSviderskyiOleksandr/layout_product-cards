<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <main>
      <section data-qa="card" class="product-card">
        <div class="product-card__image"></div>
        <div class="product-card__title">APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)</div>
        <div class="product-card__code">Product code: 195434</div>
        <div class="product-card__reviews">
          <div class="product-card__reviews__stars">
            <div class="product-card__reviews__stars__star"></div>
            <div class="product-card__reviews__stars__star"></div>
            <div class="product-card__reviews__stars__star"></div>
            <div class="product-card__reviews__stars__star"></div>
            <div class="product-card__reviews__stars__star"></div>
          </div>
          <div class="product-card__reviews__review-count">Reviews: 5</div>
        </div>
        <div class="product-card__price">
          <div class="product-card__price__title">Price:</div>
          <div class="product-card__price__value">$2,199</div>
        </div>
        <div data-qa="hover" class="product-card__button">Buy</div>
      </section>
    </main>
  </body>
</html>
